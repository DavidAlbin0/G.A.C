server {
    listen 8000;
    server_name localhost;

    # Incrementar el limite de tamaño para subidas de archivos en todo el Gateway
    client_max_body_size 100M;

    # Microservicio 1: Auth & Files (Spring Boot)
    location /api/auth/ {
        proxy_pass http://backend:8080/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/files/ {
        proxy_pass http://backend:8080/api/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Microservicio 2: Auditoría (Spring Boot)
    location /api/audit/ {
        proxy_pass http://audit-service:8082/api/audit/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Microservicio 3: XMLends (Spring Boot)
    location /api/xmlends/ {
        proxy_pass http://xmlends-service:8083/api/xmlends/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

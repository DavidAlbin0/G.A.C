services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_envarch
    # Reinicia automáticamente al arrancar Docker o tras fallos, excepto si se detuvo manualmente
    restart: unless-stopped
    command: mongod --port 29018
    ports:
      - "127.0.0.1:29018:29018"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./envArch
      dockerfile: Dockerfile
    container_name: backend_envarch
    # Reinicia automáticamente al arrancar Docker o tras fallos, excepto si se detuvo manualmente
    restart: unless-stopped
    ports:
      - "127.0.0.1:10100:10100"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:29018/envarchdb
      - PORT=10100
      - JWT_SECRET=9a2f64a13e5f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b
      - UPLOAD_DIR=/app/uploads
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_envarch
    # Reinicia automáticamente al arrancar Docker o tras fallos, excepto si se detuvo manualmente
    restart: unless-stopped
    ports:
      - "7459:7459"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - app-network

  audit-service:
    build:
      context: ./auditService
      dockerfile: Dockerfile
    container_name: audit_envarch
    # Reinicia automáticamente al arrancar Docker o tras fallos, excepto si se detuvo manualmente
    restart: unless-stopped
    ports:
      - "127.0.0.1:10101:10101"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:29018/auditdb
      - PORT=10101
    depends_on:
      - mongodb
    networks:
      - app-network

  xmlends-service:
    build:
      context: ./xmlendsService
      dockerfile: Dockerfile
    container_name: xmlends_envarch
    # Reinicia automáticamente al arrancar Docker o tras fallos, excepto si se detuvo manualmente
    restart: unless-stopped
    ports:
      - "127.0.0.1:10102:10102"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:29018/xmlendsdb
      - PORT=10102
      - JWT_SECRET=9a2f64a13e5f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b
      - UPLOAD_DIR=/app/uploads_xmlends
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
    volumes:
      - xmlends_uploads:/app/uploads_xmlends
    networks:
      - app-network

  gateway:
    image: nginx:alpine
    container_name: gateway_envarch
    # Reinicia automáticamente al arrancar Docker o tras fallos, excepto si se detuvo manualmente
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - audit-service
      - xmlends-service
    networks:
      - app-network

volumes:
  mongo_data:
  backend_uploads:
  xmlends_uploads:

networks:
  app-network:
    driver: bridge
